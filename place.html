<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="description"
        content="Explore Nigeria, a travel destination featuring rich culture, history, landmarks, tourism highlights, and essential visitor information for travelers. online!">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Precious Anietem">
    <title>Nigeria | Place Page</title>

    <link rel="stylesheet" href="styles/place.css">
    <link rel="stylesheet" href="styles/place-large.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Nigeria</h1>
    </header>

    <main>

        <picture>
            <source media="(min-width: 768px)" srcset="images/hero-large.webp">

            <img src="images/hero-small.webp" alt="Beautiful view of Nigeria" class="hero-image">
        </picture>

        <section class="data">
            <h2>Data</h2>

            <p><strong>Area:</strong> 923,768 km²</p>
            <p><strong>Population:</strong> 220 Million</p>
            <p><strong>Capital:</strong> Abuja</p>
            <p><strong>Languages:</strong> English</p>
            <p><strong>Currency:</strong> Naira</p>
            <p><strong>Time Zone:</strong> UTC+1</p>
        </section>

        <section class="weather">
            <h2>Weather</h2>

            <img src="images/weather.svg" alt="Weather icon" class="weather-icon">

            <p><strong>Temperature:</strong> <span id="temp">8</span> °C</p>

            <p><strong>Conditions:</strong> Cloudy</p>

            <p><strong>Wind:</strong> <span id="wind">10</span> km/h</p>

            <p><strong>Wind Chill:</strong>
                <span id="windchill"></span>
            </p>
        </section>

    </main>

    <footer>
        <p>
            © <span id="year"></span> |
            Precious Anietem |
            Nigeria
        </p>

        <p id="lastModified"></p>
    </footer>

</body>

</html>
