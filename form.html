<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Precious Anietem">
    <meta name="description"
        content="Submit a product review by selecting a product, rating its quality, and sharing your experience through a simple and user-friendly form.">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="styles/style.css">
</head>

<body>

    <header>
        <h1>Product Review Form</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <!-- Product Name -->
            <label for="product">Product Name</label>
            <select id="product" name="product" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <!-- Overall Rating -->
            <fieldset>
                <legend>Overall Rating</legend>

                <label><input type="radio" name="rating" value="1" required> ☆</label>
                <label><input type="radio" name="rating" value="2"> ☆☆</label>
                <label><input type="radio" name="rating" value="3"> ☆☆☆</label>
                <label><input type="radio" name="rating" value="4"> ☆☆☆☆</label>
                <label><input type="radio" name="rating" value="5"> ☆☆☆☆☆</label>

            </fieldset>

            <!-- Date -->
            <label for="date">Date of Installation</label>
            <input type="date" id="date" name="date" required>

            <!-- Features -->
            <fieldset>
                <legend>Useful Features</legend>

                <label><input type="checkbox" name="features" value="quality"> Quality</label>
                <label><input type="checkbox" name="features" value="durability"> Durability</label>
                <label><input type="checkbox" name="features" value="design"> Design</label>
                <label><input type="checkbox" name="features" value="price"> Price</label>

            </fieldset>

            <!-- Review -->
            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>

            <!-- Username -->
            <label for="username">User Name</label>
            <input type="text" id="username" name="username">

            <!-- Submit -->
            <input type="submit" value="Submit Review">

        </form>
    </main>

    <footer>
        <p>&copy; 2026 Product Reviews</p>
    </footer>

    <script src="scripts/script.js"></script>
</body>

</html>
