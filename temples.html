<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temple Album</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles/temples2.css" />
    <link rel="stylesheet" href="styles/temples-large.css" />
    <script src="scripts/temples.js" defer></script>
</head>

<body>
    <header>





        <h1 class="temp">Temple Album</h1>

        <nav id="navMenu">

            <a href="#">Home</a>
            <a href="#">Old</a>
            <a href="#">New</a>
            <a href="#">Large</a>
            <a href="#">Small</a>
        </nav>
        <button id="menuBtn" aria-label="Menu">☰</button>
    </header>

    <main>
        <h1>Temples Gallery</h1>

        <section class="grid">
            <figure>
                <img src="images/brigham-city-utah-temple.webp" alt="Temple 1">
                <figcaption>Brigham City Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/gilbert-arizona-temple.webp" alt="Temple 2">
                <figcaption>Gibert Arizona Temple</figcaption>
            </figure>

            <figure>
                <img src="images/jordan-river-utah-temple.webp" alt="Temple 3">
                <figcaption>Jordan River Temple</figcaption>
            </figure>

            <figure>
                <img src="images/lehi-utah-temple.webp" alt="Temple 4">
                <figcaption>Lehi Utah Temple</figcaption>
            </figure>

            <figure>
                <img src="images/oakland-california-temple.webp" alt="Temple 5">
                <figcaption>Oakland California Temple</figcaption>
            </figure>

            <figure>
                <img src="images/pocatello-idaho-temple.webp" alt="Temple 6">
                <figcaption>Pocatello Idaho Temple</figcaption>
            </figure>

            <figure>
                <img src="images/salt-lake-temple.webp" alt="Temple 7">
                <figcaption>Salt Lake Temple</figcaption>
            </figure>

            <figure>
                <img src="images/san-diego-temple.webp" alt="Temple 8">
                <figcaption>San Diego Temple</figcaption>
            </figure>

            <figure>
                <img src="images/washington-temple.webp" alt="Temple 9">
                <figcaption>Washington D.C Temple</figcaption>
            </figure>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> Temple Album</p>
        <p>Last Modified: <span id="lastModified"></span></p>
    </footer>
</body>

</html>
